name: CI

on:
  push:
    branches:
      - production-release-v2
  pull_request:
    branches:
      - production-release-v2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      SUPABASE_URL: https://zdwgfoonwzvvwjqibrkf.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_mock_ci_token_for_headless_build
      VITE_SUPABASE_URL: https://zdwgfoonwzvvwjqibrkf.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mock_ci_token_for_headless_build
      UPSTOX_API_KEY: mock_ci_api_key
      UPSTOX_API_SECRET: mock_ci_api_secret
      TELEGRAM_BOT_TOKEN: 123456789:mock_token_for_ci_test
      TELEGRAM_CHAT_ID: 123456789
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
